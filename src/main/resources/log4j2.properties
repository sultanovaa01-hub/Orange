# Root logger
rootLogger.level = INFO
rootLogger.appenderRefs = console, file
rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File

# Console appender
appender.console.type = Console
appender.console.name = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{[yyyy-MM-dd] HH:mm:ss} %c{1}:%L [%p] - %m%n

# WARN ? green
appender.console.filter.threshold.type = ThresholdFilter
appender.console.filter.threshold.level = INFO

# File appender (daily rolling)
appender.file.type = RollingFile
appender.file.name = File
appender.file.fileName = target/logs/module-events.log
appender.file.filePattern = target/logs/module-events-%d{yyyy-MM-dd}.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{[yyyy-MM-dd] HH:mm:ss} %c{1}:%L [%p] - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1